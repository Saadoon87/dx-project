<template>
    <!-- Main calculator shell -->
    <div class="uls-page">

        <!-- Header area for the calculator -->
        <section class="uls-header">
            <div>
                <!-- Main title shown to the sales user -->
                <h1 class="uls-title">ULS Calculator</h1>

                <!-- Short helper text explaining the purpose of the page -->
                <p class="uls-subtitle">
                    Retrieve policy data, define goals, apply alterations, and generate projections.
                </p>
            </div>
        </section>

        <!-- Stepper card -->
        <section class="uls-card uls-stepper-card">

            <!-- Visual stepper showing where the user is in the guided flow -->
            <ol class="uls-stepper">
                <template for:each={steps} for:item="step">
                    <li key={step.number} class={step.cssClass}>
                        <span class="uls-step-number">{step.number}</span>
                        <span class="uls-step-label">{step.label}</span>
                    </li>
                </template>
            </ol>

        </section>

        <!-- Shared loading message area -->
        <template if:true={isLoading}>
            <section class="uls-loading">
                <lightning-spinner
                    alternative-text="Loading"
                    size="small">
                </lightning-spinner>

                <span class="uls-loading-text">{loadingMessage}</span>
            </section>
        </template>

        <!-- Shared safe error panel -->
        <template if:true={hasError}>
            <section class="uls-error-panel" role="alert">

                <!-- User-safe error title -->
                <h2 class="uls-error-title">We could not complete this action</h2>

                <!-- User-safe message returned by Apex -->
                <p class="uls-error-message">{errorState.userMessage}</p>

                <!-- Error code helps support identify the issue category -->
                <template if:true={errorState.errorCode}>
                    <p class="uls-error-detail">
                        <strong>Error Code:</strong> {errorState.errorCode}
                    </p>
                </template>

                <!-- Correlation ID helps IT Support trace the issue in logs -->
                <template if:true={errorState.correlationId}>
                    <p class="uls-error-detail">
                        <strong>Correlation ID:</strong> {errorState.correlationId}
                    </p>
                </template>

                <!-- Button to clear the current error message from the screen -->
                <lightning-button
                    label="Dismiss"
                    variant="neutral"
                    onclick={clearError}>
                </lightning-button>

            </section>
        </template>

        <!-- Step content card -->
        <section class="uls-card">

            <!-- Step 1: Policy Retrieval -->
            <template if:true={isStep1}>

                <div class="uls-section-heading">
                    <h2>Step 1: Policy Retrieval</h2>
                    <p>
                        Enter the policy number, then retrieve the latest available policy data.
                    </p>
                </div>

                <!-- Policy retrieval form -->
                <div class="uls-form-grid">

                    <!-- Policy number input controlled by JavaScript state -->
                    <lightning-input
                        name="policyNumber"
                        label="Policy Number"
                        value={policyNumber}
                        placeholder="Enter policy number"
                        onchange={handlePolicyNumberChange}
                        disabled={isLoading}
                        required>
                    </lightning-input>

                    <!-- Retrieve button. Disabled while loading to prevent duplicate submit. -->
                    <div class="uls-button-row">
                        <lightning-button
                            label="Retrieve Policy"
                            variant="brand"
                            onclick={handleRetrievePolicy}
                            disabled={isRetrieveDisabled}>
                        </lightning-button>
                    </div>

                </div>

                <!-- Small helper message for the user -->
                <p class="uls-help-text">
                    The policy number is mandatory. The policy must exist and must be eligible for ULS calculation.
                </p>

            </template>

            <!-- Step 2: Define Goal -->
            <template if:true={isStep2}>

                <div class="uls-section-heading">
                    <h2>Step 2: Define Goal</h2>
                    <p>
                        Review the retrieved policy details, load the inflation rate, and calculate the target values.
                    </p>
                </div>

                <!-- Basic retrieved policy summary -->
                <template if:true={hasPolicyData}>
                    <div class="uls-summary-card">
                        <h3>Retrieved Policy Summary</h3>

                        <dl class="uls-summary-grid">
                            <div>
                                <dt>Policy Number</dt>
                                <dd>{displayPolicyNumber}</dd>
                            </div>

                            <div>
                                <dt>Customer Name</dt>
                                <dd>{displayCustomerName}</dd>
                            </div>

                            <div>
                                <dt>Maturity Date</dt>
                                <dd>{displayMaturityDate}</dd>
                            </div>

                            <div>
                                <dt>Current Premium</dt>
                                <dd>{displayCurrentPremium}</dd>
                            </div>

                            <div>
                                <dt>Current UAV</dt>
                                <dd>{displayCurrentUav}</dd>
                            </div>

                            <div>
                                <dt>Missed Premiums</dt>
                                <dd>{displayMissedPremiums}</dd>
                            </div>
                        </dl>
                    </div>
                </template>

                <!-- Inflation rate card -->
                <div class="uls-action-card">
                    <div>
                        <h3>Inflation Rate</h3>
                        <p>
                            Inflation percentage is fetched from the backend and displayed as read-only information.
                        </p>
                    </div>

                    <div class="uls-action-row">
                        <div class="uls-result-pill">
                            Current Inflation Rate: <strong>{displayInflationRate}</strong>
                        </div>

                        <lightning-button
                            label="Load Inflation Rate"
                            variant="neutral"
                            onclick={handleLoadInflationRate}
                            disabled={isLoading}>
                        </lightning-button>
                    </div>
                </div>

                <!-- Goal input form -->
                <div class="uls-goal-grid">

                    <!-- Initial Target UAV input -->
                    <lightning-input
                        type="number"
                        name="initialTargetUav"
                        label="Initial Target UAV"
                        value={goalData.initialTargetUav}
                        placeholder="Enter initial target UAV"
                        onchange={handleInitialTargetUavChange}
                        disabled={isLoading}>
                    </lightning-input>

                    <!-- Requested Final UAV input -->
                    <lightning-input
                        type="number"
                        name="requestedFinalUav"
                        label="Requested Final UAV"
                        value={goalData.requestedFinalUav}
                        placeholder="Enter requested final UAV"
                        onchange={handleRequestedFinalUavChange}
                        disabled={isLoading}>
                    </lightning-input>

                    <!-- Requested Monthly Premium input -->
                    <lightning-input
                        type="number"
                        name="requestedMonthlyPremium"
                        label="Requested Monthly Premium"
                        value={goalData.requestedMonthlyPremium}
                        placeholder="Enter requested monthly premium"
                        onchange={handleRequestedMonthlyPremiumChange}
                        disabled={isLoading}>
                    </lightning-input>

                </div>

                <!-- Calculation action buttons -->
                <div class="uls-calculation-actions">

                    <lightning-button
                        label="Calculate Inflation-Adjusted UAV"
                        variant="brand"
                        onclick={handleCalculateInflationAdjustedUav}
                        disabled={isCalculateInflationAdjustedDisabled}>
                    </lightning-button>

                    <lightning-button
                        label="Calculate Suggested Premium"
                        variant="brand"
                        onclick={handleCalculateSuggestedPremium}
                        disabled={isCalculateSuggestedPremiumDisabled}>
                    </lightning-button>

                    <lightning-button
                        label="Recalculate Final UAV"
                        variant="brand"
                        onclick={handleCalculateFinalUav}
                        disabled={isCalculateFinalUavDisabled}>
                    </lightning-button>

                </div>

                <!-- Stale result warning -->
                <template if:true={hasStaleGoalResults}>
                    <div class="uls-warning-panel">
                        One or more inputs changed after calculation. Please recalculate before continuing.
                    </div>
                </template>

                <!-- Results area -->
                <div class="uls-results-grid">

                    <!-- Inflation-adjusted UAV result -->
                    <div class="uls-result-card">
                        <h3>Inflation-Adjusted UAV</h3>

                        <dl>
                            <div>
                                <dt>Initial UAV</dt>
                                <dd>{displayInitialUavResult}</dd>
                            </div>

                            <div>
                                <dt>Inflation Rate</dt>
                                <dd>{displayInflationAdjustedRate}</dd>
                            </div>

                            <div>
                                <dt>Remaining Years</dt>
                                <dd>{displayRemainingYears}</dd>
                            </div>

                            <div>
                                <dt>Inflation-Adjusted Amount</dt>
                                <dd>{displayInflationAdjustedAmount}</dd>
                            </div>
                        </dl>
                    </div>

                    <!-- Suggested premium result -->
                    <div class="uls-result-card">
                        <h3>Suggested Premium</h3>

                        <dl>
                            <div>
                                <dt>Target Final UAV</dt>
                                <dd>{displaySuggestedTargetFinalUav}</dd>
                            </div>

                            <div>
                                <dt>Suggested Premium</dt>
                                <dd>{displaySuggestedPremium}</dd>
                            </div>

                            <div>
                                <dt>Current Premium</dt>
                                <dd>{displaySuggestedCurrentPremium}</dd>
                            </div>

                            <div>
                                <dt>Difference</dt>
                                <dd>{displaySuggestedDifference}</dd>
                            </div>
                        </dl>
                    </div>

                    <!-- Final UAV result -->
                    <div class="uls-result-card">
                        <h3>Projected Final UAV</h3>

                        <dl>
                            <div>
                                <dt>Requested Premium</dt>
                                <dd>{displayRequestedPremiumResult}</dd>
                            </div>

                            <div>
                                <dt>Current Premium</dt>
                                <dd>{displayFinalUavCurrentPremium}</dd>
                            </div>

                            <div>
                                <dt>Difference</dt>
                                <dd>{displayFinalUavDifference}</dd>
                            </div>

                            <div>
                                <dt>Projected Final UAV</dt>
                                <dd>{displayProjectedFinalUav}</dd>
                            </div>
                        </dl>
                    </div>

                </div>

            </template>

            <!-- Step 3: Apply Alterations -->
            <template if:true={isStep3}>
                <div class="uls-section-heading">
                    <h2>Step 3: Apply Alterations</h2>
                    <p>
                        Alteration sections will be wired after policy retrieval and goal calculation are complete.
                    </p>
                </div>

                <div class="uls-placeholder">
                    Fund switching, ASP, premium redirection, premium change, and term extension will be added later.
                </div>
            </template>

            <!-- Step 4: Consolidated Review -->
            <template if:true={isStep4}>
                <div class="uls-section-heading">
                    <h2>Step 4: Consolidated Review</h2>
                    <p>
                        The generated projection and year-by-year table will appear here later.
                    </p>
                </div>

                <div class="uls-placeholder">
                    Consolidated review is not implemented yet.
                </div>
            </template>

            <!-- Step 5: Generated Package -->
            <template if:true={isStep5}>
                <div class="uls-section-heading">
                    <h2>Step 5: Generated Package</h2>
                    <p>
                        Document generation is currently controlled by configuration and will be implemented later.
                    </p>
                </div>

                <div class="uls-placeholder">
                    Package generation is not implemented yet.
                </div>
            </template>

            <!-- Navigation buttons -->
            <div class="uls-navigation">

                <!-- Back button is hidden on Step 1 -->
                <template if:false={isStep1}>
                    <lightning-button
                        label="Back"
                        variant="neutral"
                        onclick={handleBack}
                        disabled={isLoading}>
                    </lightning-button>
                </template>

                <!-- Manual Next button is hidden on Step 1 because Retrieve controls moving to Step 2 -->
                <template if:false={isStep1}>
                    <template if:false={isStep5}>
                        <lightning-button
                            label="Next"
                            variant="brand"
                            onclick={handleNext}
                            disabled={isNextDisabled}>
                        </lightning-button>
                    </template>
                </template>

            </div>

        </section>

    </div>
</template>
