<template>
  <!-- Full AXA-style calculator shell. -->
  <div class="uls-shell">
    <!-- Top navigation/header area inspired by the uploaded AXA prototype. -->
    <header class="uls-topbar">
      <!-- Brand/title area. -->
      <div class="uls-topbar-brand">
        <!-- AXA logo block recreated with local CSS instead of external images/CDNs. -->
        <div class="uls-axa-logo">AXA</div>

        <!-- Divider between the logo and page title. -->
        <div class="uls-topbar-divider"></div>

        <!-- Clickable application title. Resets the calculator back to Step 1. -->
        <button
          class="uls-topbar-title-button"
          type="button"
          onclick={handleResetCalculator}
          title="Uls Calculator"
        >
          Egypt | ULS Upselling Calculator
        </button>
      </div>

      <!-- Safe user placeholder area. This does not expose any sensitive data. -->
      <div class="uls-topbar-user">
        <div class="uls-user-copy">
          <p class="uls-user-name">Sales Advisor</p>
          <p class="uls-user-role">Portfolio Management</p>
        </div>

        <!-- Simple avatar placeholder, no external icon library. -->
        <div class="uls-user-avatar" aria-hidden="true">SA</div>
      </div>
    </header>

    <!-- Body contains left navigation and main workspace. -->
    <div class="uls-body">
      <!-- Main workspace area. -->
      <main class="uls-main">
        <div class="uls-workspace">
          <!-- Sticky stepper. We only support Step 1 and Step 2 for now. -->
          <section class="uls-stepper" aria-label="ULS calculator progress">
            <!-- Stepper state when user is on Step 1. -->
            <template if:true={isStep1}>
              <div class="uls-stepper-list">
                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number uls-step-number-active">1</div>
                    <div class="uls-step-label uls-step-label-active">
                      Retrieve Policy
                    </div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">2</div>
                    <div class="uls-step-label">Define Goal</div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">3</div>
                    <div class="uls-step-label">Apply Alterations</div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">4</div>
                    <div class="uls-step-label">View Projections</div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">5</div>
                    <div class="uls-step-label">Generate Package</div>
                  </div>
                </div>
              </div>
            </template>

            <!-- Stepper state when user is on Step 2. -->
            <template if:true={isStep2}>
              <div class="uls-stepper-list">
                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number uls-step-number-active">1</div>
                    <div class="uls-step-label uls-step-label-active">
                      Retrieve Policy
                    </div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number uls-step-number-active">2</div>
                    <div class="uls-step-label uls-step-label-active">
                      Define Goal
                    </div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">3</div>
                    <div class="uls-step-label">Apply Alterations</div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">4</div>
                    <div class="uls-step-label">View Projections</div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">5</div>
                    <div class="uls-step-label">Generate Package</div>
                  </div>
                </div>
              </div>
            </template>

            <!-- Stepper state when user is on Step 3. -->
            <template if:true={isStep3}>
              <div class="uls-stepper-list">
                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number uls-step-number-active">1</div>
                    <div class="uls-step-label uls-step-label-active">
                      Retrieve Policy
                    </div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number uls-step-number-active">2</div>
                    <div class="uls-step-label uls-step-label-active">
                      Define Goal
                    </div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number uls-step-number-active">3</div>
                    <div class="uls-step-label uls-step-label-active">
                      Apply Alterations
                    </div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">4</div>
                    <div class="uls-step-label">View Projections</div>
                  </div>
                  <div class="uls-step-line"></div>
                </div>

                <div class="uls-stepper-item">
                  <div class="uls-stepper-content">
                    <div class="uls-step-number">5</div>
                    <div class="uls-step-label">Generate Package</div>
                  </div>
                </div>
              </div>
            </template>
          </section>

          <!-- Shared loading message area. -->
          <template if:true={isLoading}>
            <section class="uls-card uls-data-card-header" aria-live="polite">
              <lightning-spinner alternative-text="Loading" size="small">
              </lightning-spinner>

              <span class="uls-section-title">{loadingMessage}</span>
            </section>
          </template>

          <!-- Shared safe error panel. -->
          <template if:true={hasError}>
            <section class="uls-error-panel" role="alert">
              <!-- User-safe error title. -->
              <h2 class="uls-error-title">We could not complete this action</h2>

              <!-- User-safe Apex message. -->
              <p class="uls-error-message">{errorState.userMessage}</p>

              <!-- Error code for support troubleshooting. -->
              <template if:true={errorState.errorCode}>
                <p class="uls-error-support">
                  <strong>Error Code:</strong> {errorState.errorCode}
                </p>
              </template>

              <!-- Correlation ID for Salesforce-side troubleshooting. -->
              <template if:true={errorState.correlationId}>
                <p class="uls-error-support">
                  <strong>Correlation ID:</strong> {errorState.correlationId}
                </p>
              </template>

              <!-- Clears the visible error only. -->
              <div class="uls-button-row">
                <button
                  class="uls-button-secondary"
                  type="button"
                  onclick={clearError}
                >
                  Dismiss
                </button>
              </div>
            </section>
          </template>

          <!-- Step 1: Policy Retrieval. -->
          <template if:true={isStep1}>
            <section class="uls-retrieval-wrap uls-fade-in">
              <div class="uls-card uls-retrieval-card">
                <h2 class="uls-retrieval-title">Policy Retrieval</h2>

                <p class="uls-retrieval-subtitle">
                  Access Unit Linked Savings data to begin simulation.
                </p>

                <div class="uls-policy-input-row">
                  <!-- Policy number input remains wired to the existing LWC state. -->
                  <lightning-input
                    class="uls-policy-input"
                    data-testid="policy-number-input"
                    name="policyNumber"
                    label="Policy Number"
                    type="text"
                    value={policyNumber}
                    onchange={handlePolicyNumberChange}
                    disabled={isLoading}
                    placeholder="Enter policy number"
                    pattern="^[0-9]+$"
                    message-when-pattern-mismatch="Policy Number must contain numbers only."
                  >
                  </lightning-input>

                  <!-- Retrieve button remains wired to the existing Apex call. -->
                  <button
                    class="uls-button-primary"
                    data-testid="retrieve-policy-button"
                    type="button"
                    onclick={handleRetrievePolicy}
                    disabled={isRetrieveDisabled}
                  >
                    <template if:true={isLoading}>Loading</template>
                    <template if:false={isLoading}>Retrieve</template>
                  </button>
                </div>
              </div>
            </section>
          </template>

          <!-- Step 2: Define Goal. -->
          <template if:true={isStep2}>
            <section class="uls-step-two-grid uls-fade-in">
              <!-- Left/main content column. -->
              <div class="uls-step-two-left">
                <!-- Top customer summary card. -->
                <section
                  class="uls-card uls-card-highlight uls-customer-summary"
                >
                  <div>
                    <h2 class="uls-customer-name">{displayCustomerName}</h2>

                    <p class="uls-policy-context">
                      Protection &amp; Savings
                      <span aria-hidden="true"> | </span>
                      #{displayPolicyNumber}
                    </p>
                  </div>

                  <div class="uls-summary-metrics">
                    <p>
                      Current UAV:
                      <span class="uls-metric-value">{displayCurrentUav}</span>
                    </p>

                    <p>
                      Current Premium:
                      <span class="uls-metric-value">
                        {displayCurrentPremium}
                      </span>
                    </p>

                    <p>
                      Maturity Date:
                      <span class="uls-metric-value">
                        {displayMaturityDate}
                      </span>
                    </p>
                  </div>
                </section>

                <!-- Retrieved customer and policy data card. -->
                <section class="uls-card">
                  <div class="uls-data-card-header">
                    <h3 class="uls-section-title">
                      Retrieved Customer and Policy Data
                    </h3>

                    <span class="uls-pill">Core System Data</span>
                  </div>

                  <!-- Main policy/customer information. -->
                  <div class="uls-data-section">
                    <div class="uls-two-column-grid">
                      <!-- Policy information block. -->
                      <div>
                        <h4 class="uls-data-block-title">Policy Information</h4>

                        <div class="uls-detail-grid">
                          <span class="uls-detail-label">Policy Number</span>
                          <span class="uls-detail-value">
                            {displayPolicyNumber}
                          </span>

                          <span class="uls-detail-label">Maturity Date</span>
                          <span class="uls-detail-value">
                            {displayMaturityDate}
                          </span>

                          <span class="uls-detail-label">Frequency</span>
                          <span
                            class="uls-detail-value uls-detail-value-uppercase"
                          >
                            <template if:true={policyData.frequency}>
                              {policyData.frequency}
                            </template>
                            <template if:false={policyData.frequency}>
                              <span class="uls-not-available">
                                Not available
                              </span>
                            </template>
                          </span>

                          <span class="uls-detail-label">Initial Premium</span>
                          <span class="uls-detail-value">
                            <template if:true={policyData.initialPremium}>
                              {policyData.initialPremium}
                            </template>
                            <template if:false={policyData.initialPremium}>
                              <span class="uls-not-available">
                                Not available
                              </span>
                            </template>
                          </span>

                          <span class="uls-detail-label">Current Premium</span>
                          <span class="uls-detail-value">
                            {displayCurrentPremium}
                          </span>

                          <span class="uls-detail-label">Missed Premiums</span>
                          <span class="uls-detail-value">
                            {displayMissedPremiums}
                          </span>
                        </div>
                      </div>

                      <!-- Customer information block. -->
                      <div>
                        <h4 class="uls-data-block-title">
                          Customer Information
                        </h4>

                        <div class="uls-detail-grid">
                          <span class="uls-detail-label">Customer Name</span>
                          <span
                            class="uls-detail-value uls-detail-value-uppercase"
                          >
                            {displayCustomerName}
                          </span>

                          <span class="uls-detail-label">Age</span>
                          <span class="uls-detail-value">
                            <template if:true={policyData.lifeInsuredAge}>
                              {policyData.lifeInsuredAge}
                            </template>
                            <template if:false={policyData.lifeInsuredAge}>
                              <span class="uls-not-available">
                                Not available
                              </span>
                            </template>
                          </span>

                          <span class="uls-detail-label">Gender</span>
                          <span
                            class="uls-detail-value uls-detail-value-uppercase"
                          >
                            <template if:true={policyData.lifeInsuredGender}>
                              {policyData.lifeInsuredGender}
                            </template>
                            <template if:false={policyData.lifeInsuredGender}>
                              <span class="uls-not-available">
                                Not available
                              </span>
                            </template>
                          </span>

                          <span class="uls-detail-label">Insured DOB</span>
                          <span class="uls-detail-value">
                            <template if:true={policyData.lifeInsuredDOB}>
                              {policyData.lifeInsuredDOB}
                            </template>
                            <template if:false={policyData.lifeInsuredDOB}>
                              <span class="uls-not-available">
                                Not available
                              </span>
                            </template>
                          </span>

                          <span class="uls-detail-label">Child DOB</span>
                          <span class="uls-detail-value">
                            <template if:true={policyData.childDob}>
                              {policyData.childDob}
                            </template>
                            <template if:false={policyData.childDob}>
                              <span class="uls-not-available">
                                Not available
                              </span>
                            </template>
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Investment and benefits area. -->
                  <div class="uls-data-soft-section">
                    <div class="uls-two-column-grid">
                      <!-- Investment strategy block. -->
                      <div>
                        <h4 class="uls-data-block-title">
                          Investment Strategy
                        </h4>

                        <template if:true={hasInvestmentFunds}>
                          <div class="uls-allocation-list">
                            <template
                              for:each={displayInvestmentFunds}
                              for:item="fund"
                            >
                              <div key={fund.key} class="uls-allocation-row">
                                <span class="uls-allocation-name">
                                  {fund.fundName}
                                </span>

                                <span class="uls-allocation-percent">
                                  {fund.allocationPercentage}
                                </span>
                              </div>
                            </template>
                          </div>
                        </template>

                        <template if:false={hasInvestmentFunds}>
                          <span class="uls-not-available">
                            Fund not available
                          </span>
                        </template>
                      </div>

                      <!-- Benefits summary block. -->
                      <div>
                        <h4 class="uls-data-block-title">
                          Current Benefits Summary
                        </h4>

                        <template if:true={hasBenefits}>
                          <div class="uls-benefit-grid">
                            <template
                              for:each={displayBenefits}
                              for:item="benefit"
                            >
                              <div key={benefit.key} class="uls-benefit-card">
                                <p class="uls-benefit-label">{benefit.name}</p>
                                <p class="uls-benefit-value">
                                  {benefit.amount}
                                </p>
                              </div>
                            </template>
                          </div>
                        </template>

                        <template if:false={hasBenefits}>
                          <span class="uls-not-available">
                            Benefits not available
                          </span>
                        </template>
                      </div>
                    </div>
                  </div>
                </section>
              </div>

              <!-- Right sticky scenario summary. -->
              <aside class="uls-card uls-scenario-card">
                <div class="uls-scenario-header">
                  <p class="uls-scenario-label">Scenario Analysis</p>

                  <p class="uls-scenario-main">
                    EGP {goalData.requestedMonthlyPremium}
                    <span class="uls-scenario-suffix">/ Month</span>
                  </p>
                </div>

                <div class="uls-scenario-body">
                  <div class="uls-scenario-row">
                    <span>Current Premium</span>
                    <span>{displayCurrentPremium}</span>
                  </div>

                  <div class="uls-scenario-row">
                    <span>Suggested Premium</span>
                    <span>{displaySuggestedPremium}</span>
                  </div>

                  <div class="uls-scenario-row uls-scenario-row-strong">
                    <span>Requested Premium</span>
                    <span>EGP {goalData.requestedMonthlyPremium}</span>
                  </div>

                  <div class="uls-scenario-row uls-scenario-divider">
                    <span>Monthly Increase</span>
                    <span class="uls-positive"
                      >{displayFinalUavDifference}</span
                    >
                  </div>

                  <div class="uls-scenario-row">
                    <span>Projected Final UAV</span>
                    <span>{displayProjectedFinalUav}</span>
                  </div>

                  <!-- Moves the user from Step 2 into Step 3: Apply Alterations. -->
                  <button
                    class="uls-button-red"
                    type="button"
                    onclick={handleApplyAlterations}
                    disabled={isApplyAlterationsDisabled}
                  >
                    Apply Alterations →
                  </button>
                </div>
              </aside>

              <!-- Goal-based target definition cards. -->
              <section class="uls-goal-section">
                <div class="uls-goal-section-header">
                  <h2 class="uls-goal-title">Goal-Based Target Definition</h2>
                  <p class="uls-goal-section-subtitle">
                    Define each target separately, then run the relevant
                    calculation.
                  </p>
                </div>

                <div class="uls-goal-components-grid">
                  <!-- Component 1: Target with inflation. -->
                  <article class="uls-goal-component-card">
                    <div class="uls-goal-component-header">
                      <span class="uls-goal-component-number">1</span>
                      <div>
                        <h3 class="uls-goal-component-title">
                          Target with Inflation
                        </h3>
                        <p class="uls-goal-component-helper">
                          Enter the target UAV and calculate the
                          inflation-adjusted future value.
                        </p>
                      </div>
                    </div>

                    <label class="uls-goal-label"> Initial Target UAV </label>

                    <div class="uls-currency-row">
                      <span class="uls-currency-prefix">EGP</span>

                      <lightning-input
                        class="uls-large-input"
                        data-testid="initial-target-uav-input"
                        name="initialTargetUav"
                        variant="label-hidden"
                        label="Initial Target UAV"
                        type="number"
                        min="0"
                        step="0.01"
                        value={goalData.initialTargetUav}
                        onchange={handleInitialTargetUavChange}
                        disabled={isLoading}
                        message-when-range-underflow="Amount cannot be less than zero."
                        message-when-bad-input="Please enter a valid number."
                      >
                      </lightning-input>
                    </div>

                    <div class="uls-goal-result-strip">
                      <div>
                        <span class="uls-goal-result-label"
                          >Inflation Rate</span
                        >
                        <strong>{displayInflationRate}</strong>
                      </div>

                      <div>
                        <span class="uls-goal-result-label">Adjusted FV</span>
                        <strong>{displayInflationAdjustedAmount}</strong>
                      </div>
                    </div>

                    <div class="uls-button-row">
                      <button
                        class="uls-button-secondary"
                        type="button"
                        onclick={handleLoadInflationRate}
                        disabled={isLoading}
                      >
                        Load Inflation Rate
                      </button>

                      <button
                        class="uls-button-primary"
                        type="button"
                        onclick={handleCalculateInflationAdjustedUav}
                        disabled={isCalculateInflationAdjustedDisabled}
                      >
                        Calculate Inflation-Adjusted UAV
                      </button>
                    </div>

                    <template if:true={goalData.isInflationAdjustedUavStale}>
                      <p class="uls-stale-warning">
                        Input changed. Please recalculate this result.
                      </p>
                    </template>
                  </article>

                  <!-- Component 2: Requested Final UAV. -->
                  <article class="uls-goal-component-card">
                    <div class="uls-goal-component-header">
                      <span class="uls-goal-component-number">2</span>
                      <div>
                        <h3 class="uls-goal-component-title">
                          Requested Final UAV
                        </h3>
                        <p class="uls-goal-component-helper">
                          Enter the required final UAV and calculate the
                          suggested premium.
                        </p>
                      </div>
                    </div>

                    <label class="uls-goal-label"> Requested Final UAV </label>

                    <div class="uls-currency-row">
                      <span class="uls-currency-prefix">EGP</span>

                      <lightning-input
                        class="uls-large-input"
                        data-testid="requested-final-uav-input"
                        name="requestedFinalUav"
                        variant="label-hidden"
                        label="Requested Final UAV"
                        type="number"
                        min="0"
                        step="0.01"
                        value={goalData.requestedFinalUav}
                        onchange={handleRequestedFinalUavChange}
                        disabled={isLoading}
                        message-when-range-underflow="Amount cannot be less than zero."
                        message-when-bad-input="Please enter a valid number."
                      >
                      </lightning-input>
                    </div>

                    <div class="uls-goal-result-strip">
                      <div>
                        <span class="uls-goal-result-label"
                          >Suggested Premium</span
                        >
                        <strong>{displaySuggestedPremium}</strong>
                      </div>
                    </div>

                    <div class="uls-button-row">
                      <button
                        class="uls-button-primary"
                        type="button"
                        onclick={handleCalculateSuggestedPremium}
                        disabled={isCalculateSuggestedPremiumDisabled}
                      >
                        Calculate Suggested Premium
                      </button>
                    </div>

                    <template if:true={goalData.isSuggestedPremiumStale}>
                      <p class="uls-stale-warning">
                        Input changed. Please recalculate this result.
                      </p>
                    </template>
                  </article>

                  <!-- Component 3: Requested Monthly Premium. -->
                  <article
                    class="uls-goal-component-card uls-goal-component-card-wide"
                  >
                    <div class="uls-goal-component-header">
                      <span class="uls-goal-component-number">3</span>
                      <div>
                        <h3 class="uls-goal-component-title">
                          Requested Monthly Premium
                        </h3>
                        <p class="uls-goal-component-helper">
                          Enter the advisor-requested monthly premium and
                          recalculate the projected final UAV.
                        </p>
                      </div>
                    </div>

                    <div class="uls-goal-monthly-grid">
                      <div>
                        <label class="uls-goal-label">
                          Requested Monthly Premium
                        </label>

                        <div class="uls-currency-row">
                          <span class="uls-currency-prefix">EGP</span>

                          <lightning-input
                            class="uls-large-input"
                            data-testid="requested-monthly-premium-input"
                            name="requestedMonthlyPremium"
                            variant="label-hidden"
                            label="Requested Monthly Premium"
                            type="number"
                            min="0"
                            step="0.01"
                            value={goalData.requestedMonthlyPremium}
                            onchange={handleRequestedMonthlyPremiumChange}
                            disabled={isLoading}
                            message-when-range-underflow="Amount cannot be less than zero."
                            message-when-bad-input="Please enter a valid number."
                          >
                          </lightning-input>
                        </div>
                      </div>

                      <div class="uls-goal-result-panel">
                        <span class="uls-goal-result-label"
                          >Monthly Increase</span
                        >
                        <strong class="uls-positive"
                          >{displayFinalUavDifference}</strong
                        >

                        <span class="uls-goal-result-label"
                          >Projected Final UAV</span
                        >
                        <strong>{displayProjectedFinalUav}</strong>
                      </div>
                    </div>

                    <div class="uls-button-row">
                      <button
                        class="uls-button-primary"
                        type="button"
                        onclick={handleCalculateFinalUav}
                        disabled={isCalculateFinalUavDisabled}
                      >
                        Recalculate Final UAV
                      </button>
                    </div>

                    <template if:true={goalData.isFinalUavStale}>
                      <p class="uls-stale-warning">
                        Input changed. Please recalculate this result.
                      </p>
                    </template>
                  </article>
                </div>
              </section>
            </section>
          </template>

          <!-- Step 3: Apply Alterations Content. -->
          <template if:true={isStep3}>
            <section
              class="uls-goal-section uls-fade-in"
              data-testid="step-3-apply-alterations"
            >
              <div class="uls-goal-section-header">
                <h2 class="uls-goal-title">Apply Alterations</h2>
                <p class="uls-goal-section-subtitle">
                  Apply the approved alteration components before generating the
                  consolidated projection review.
                </p>
              </div>

              <!-- Actuarial orchestration banner. -->
              <section class="uls-card uls-card-highlight">
                <div class="uls-data-card-header">
                  <h3 class="uls-section-title">Actuarial Orchestration</h3>
                  <span class="uls-pill">Step 3</span>
                </div>

                <p class="uls-retrieval-subtitle">
                  1. Premium Change → 2. Switch → 3. ASP → 4. Redirection → 5.
                  Increase Term
                </p>
              </section>

              <!-- 1. Regular Premium Change. -->
              <article class="uls-card">
                <div class="uls-data-card-header">
                  <h3 class="uls-section-title">1. Regular Premium Change</h3>
                  <span class="uls-pill">Active Scenario</span>
                </div>

                <div class="uls-two-column-grid">
                  <div class="uls-data-soft-section">
                    <h4 class="uls-data-block-title">
                      Current Monthly Premium
                    </h4>
                    <p class="uls-customer-name">{displayCurrentPremium}</p>
                  </div>

                  <div class="uls-data-soft-section">
                    <h4 class="uls-data-block-title">New Requested Premium</h4>

                    <div class="uls-currency-row">
                      <span class="uls-currency-prefix">EGP</span>

                      <lightning-input
                        class="uls-large-input"
                        variant="label-hidden"
                        label="New Requested Premium"
                        type="number"
                        min="0"
                        step="0.01"
                        value={alterationData.requestedMonthlyPremium}
                        onchange={handleAlterationRequestedPremiumChange}
                        disabled={isLoading}
                        message-when-range-underflow="Amount cannot be less than zero."
                        message-when-bad-input="Please enter a valid number."
                      >
                      </lightning-input>
                    </div>

                    <p class="uls-goal-component-helper">
                      Current selected value:
                      {displayAlterationRequestedPremium}
                    </p>
                  </div>
                </div>
              </article>

              <!-- 2. Fund Switching. -->
              <article class="uls-card">
                <div class="uls-data-card-header">
                  <div>
                    <h3 class="uls-section-title">
                      2. Fund Switching (UAV Balance)
                    </h3>
                    <p class="uls-goal-component-helper">
                      Reallocate the existing UAV balance across available
                      funds.
                    </p>
                  </div>

                  <label class="uls-detail-value">
                    <input
                      type="checkbox"
                      checked={alterationData.fundSwitchEnabled}
                      onchange={handleFundSwitchToggle}
                      disabled={isLoading}
                    />
                    Enable
                  </label>
                </div>

                <template if:true={alterationData.fundSwitchEnabled}>
                  <template if:true={hasAvailableFunds}>
                    <div class="uls-allocation-list">
                      <template
                        for:each={alterationData.fundSwitchRows}
                        for:item="row"
                      >
                        <div key={row.key} class="uls-allocation-row">
                          <lightning-combobox
                            class="uls-large-input"
                            data-key={row.key}
                            variant="label-hidden"
                            label="Fund"
                            value={row.fundId}
                            options={displayAvailableFunds}
                            onchange={handleFundSwitchFundChange}
                            disabled={isLoading}
                          >
                          </lightning-combobox>

                          <lightning-input
                            class="uls-large-input"
                            data-key={row.key}
                            variant="label-hidden"
                            label="Allocation Percentage"
                            type="number"
                            min="0"
                            max="100"
                            step="0.01"
                            value={row.allocationPercentage}
                            onchange={handleFundSwitchAllocationChange}
                            disabled={isLoading}
                            message-when-range-underflow="Percentage cannot be less than zero."
                            message-when-range-overflow="Percentage cannot be more than 100."
                          >
                          </lightning-input>

                          <button
                            class="uls-button-secondary"
                            type="button"
                            data-key={row.key}
                            onclick={handleRemoveFundSwitchRow}
                            disabled={isLoading}
                          >
                            Remove
                          </button>
                        </div>
                      </template>
                    </div>

                    <div class="uls-button-row">
                      <button
                        class="uls-button-secondary"
                        type="button"
                        onclick={handleAddFundSwitchRow}
                        disabled={isLoading}
                      >
                        + Add Row
                      </button>

                      <span class={fundSwitchTotalClass}>
                        Total: {fundSwitchTotal}%
                      </span>
                    </div>
                  </template>

                  <template if:false={hasAvailableFunds}>
                    <p class="uls-not-available">
                      No available funds were loaded. Please try again or
                      contact support.
                    </p>
                  </template>
                </template>
              </article>

              <!-- 3. Additional Single Premium. -->
              <article class="uls-card">
                <div class="uls-data-card-header">
                  <div>
                    <h3 class="uls-section-title">
                      3. Additional Single Premium (ASP)
                    </h3>
                    <p class="uls-goal-component-helper">
                      Add a single premium and select the target fund.
                    </p>
                  </div>

                  <label class="uls-detail-value">
                    <input
                      type="checkbox"
                      checked={alterationData.aspEnabled}
                      onchange={handleAspToggle}
                      disabled={isLoading}
                    />
                    Enable
                  </label>
                </div>

                <template if:true={alterationData.aspEnabled}>
                  <div class="uls-two-column-grid">
                    <div>
                      <label class="uls-goal-label">Investment Amount</label>

                      <div class="uls-currency-row">
                        <span class="uls-currency-prefix">EGP</span>

                        <lightning-input
                          class="uls-large-input"
                          variant="label-hidden"
                          label="ASP Amount"
                          type="number"
                          min="0"
                          step="0.01"
                          value={alterationData.aspAmount}
                          onchange={handleAspAmountChange}
                          disabled={isLoading}
                        >
                        </lightning-input>
                      </div>
                    </div>

                    <div>
                      <label class="uls-goal-label"
                        >Allocation Target Fund</label
                      >

                      <lightning-combobox
                        class="uls-large-input"
                        variant="label-hidden"
                        label="Allocation Target Fund"
                        value={alterationData.aspFundId}
                        options={displayAvailableFunds}
                        onchange={handleAspFundChange}
                        disabled={isLoading}
                      >
                      </lightning-combobox>
                    </div>
                  </div>
                </template>
              </article>

              <!-- 4. Future Premium Redirection. -->
              <article class="uls-card">
                <div class="uls-data-card-header">
                  <div>
                    <h3 class="uls-section-title">
                      4. Future Premium Redirection
                    </h3>
                    <p class="uls-goal-component-helper">
                      Redirect future premiums across selected funds.
                    </p>
                  </div>

                  <label class="uls-detail-value">
                    <input
                      type="checkbox"
                      checked={alterationData.redirectionEnabled}
                      onchange={handleRedirectionToggle}
                      disabled={isLoading}
                    />
                    Enable
                  </label>
                </div>

                <template if:true={alterationData.redirectionEnabled}>
                  <template if:true={hasAvailableFunds}>
                    <div class="uls-allocation-list">
                      <template
                        for:each={alterationData.redirectionRows}
                        for:item="row"
                      >
                        <div key={row.key} class="uls-allocation-row">
                          <lightning-combobox
                            class="uls-large-input"
                            data-key={row.key}
                            variant="label-hidden"
                            label="Redirected Fund"
                            value={row.fundId}
                            options={displayAvailableFunds}
                            onchange={handleRedirectionFundChange}
                            disabled={isLoading}
                          >
                          </lightning-combobox>

                          <lightning-input
                            class="uls-large-input"
                            data-key={row.key}
                            variant="label-hidden"
                            label="Redirection Percentage"
                            type="number"
                            min="0"
                            max="100"
                            step="0.01"
                            value={row.allocationPercentage}
                            onchange={handleRedirectionAllocationChange}
                            disabled={isLoading}
                          >
                          </lightning-input>

                          <button
                            class="uls-button-secondary"
                            type="button"
                            data-key={row.key}
                            onclick={handleRemoveRedirectionRow}
                            disabled={isLoading}
                          >
                            Remove
                          </button>
                        </div>
                      </template>
                    </div>

                    <div class="uls-button-row">
                      <button
                        class="uls-button-secondary"
                        type="button"
                        onclick={handleAddRedirectionRow}
                        disabled={isLoading}
                      >
                        + Add Redirected Fund
                      </button>

                      <span class={redirectionTotalClass}>
                        Total: {redirectionTotal}%
                      </span>
                    </div>
                  </template>

                  <template if:false={hasAvailableFunds}>
                    <p class="uls-not-available">
                      No available funds were loaded. Please try again or
                      contact support.
                    </p>
                  </template>
                </template>
              </article>

              <!-- 5. Increase ULS Term. -->
              <article class="uls-card">
                <div class="uls-data-card-header">
                  <div>
                    <h3 class="uls-section-title">5. Increase ULS Term</h3>
                    <p class="uls-goal-component-helper">
                      Select additional years before projection generation.
                    </p>
                  </div>

                  <label class="uls-detail-value">
                    <input
                      type="checkbox"
                      checked={alterationData.termExtensionEnabled}
                      onchange={handleTermExtensionToggle}
                      disabled={isLoading}
                    />
                    Enable
                  </label>
                </div>

                <template if:true={alterationData.termExtensionEnabled}>
                  <div class="uls-two-column-grid">
                    <div>
                      <label class="uls-goal-label">Add Extension Years</label>

                      <template if:true={hasTermExtensionOptions}>
                        <lightning-combobox
                          class="uls-large-input"
                          variant="label-hidden"
                          label="Add Extension Years"
                          value={alterationData.termExtensionYears}
                          options={displayTermExtensionOptions}
                          onchange={handleTermExtensionYearsChange}
                          disabled={isLoading}
                        >
                        </lightning-combobox>
                      </template>

                      <template if:false={hasTermExtensionOptions}>
                        <p class="uls-not-available">
                          No term extension options were loaded. Please try
                          again or contact support.
                        </p>
                      </template>
                    </div>

                    <div class="uls-data-soft-section">
                      <h4 class="uls-data-block-title">
                        Current Maturity Date
                      </h4>
                      <p class="uls-detail-value">{displayMaturityDate}</p>

                      <h4 class="uls-data-block-title">Selected Extension</h4>
                      <p class="uls-detail-value">
                        {displaySelectedTermExtension}
                      </p>
                    </div>
                  </div>
                </template>
              </article>

              <div class="uls-button-row">
                <button
                  class="uls-button-secondary"
                  type="button"
                  onclick={handleBack}
                >
                  ← Back to Define Goal
                </button>

                <button
                  class="uls-button-primary"
                  type="button"
                  disabled
                  title="Step 4 is not implemented yet."
                >
                  Generate Consolidated Review →
                </button>
              </div>
            </section>
          </template>
        </div>
      </main>
    </div>
  </div>
</template>
